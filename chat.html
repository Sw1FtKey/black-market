<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат — Black Market</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/chat.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="chat-body">
    
    <header class="main-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
        <a href="index.html" class="back-button" style="position: static; margin-right: auto;">← Назад</a>
        
        <div class="logo-center" style="position: absolute; left: 50%; transform: translateX(-50%);">
            <span class="logo-black">BLACK</span>
            <span class="logo-market">MARKET</span>
        </div>
        
        <div style="width: 100px;"></div>
    </header>

    <div class="chat-container">
        <div class="chat-sidebar">
            <div class="chat-sidebar-header">
                <h2><i data-lucide="message-circle" width="18" height="18"></i> Сообщения</h2>
            </div>
            <div id="chatList" class="chat-list">
                <div class="chat-loading">
                    <div style="margin-bottom: 15px; color:#666; display:flex; justify-content:center;"><i data-lucide="message-circle" width="48" height="48"></i></div>
                    <p>Загрузка...</p>
                </div>
            </div>
        </div>

        <div id="chatWindow" class="chat-window">
            <div class="chat-empty">
                <div style="margin-bottom: 20px; opacity: 0.3; display:flex; justify-content:center;"><i data-lucide="message-circle" width="64" height="64"></i></div>
                <p>Выберите чат или напишите продавцу</p>
            </div>
        </div>
    </div>

    <script>document.addEventListener("DOMContentLoaded", () => { if (window.lucide) lucide.createIcons(); });</script>
    <script type="module" src="js/error-logger.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/chat-ui.js"></script>
</body>
</html>
