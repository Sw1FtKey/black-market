<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Выбор сервера — Black Market</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/servers.css">
</head>
<body class="servers-body">

<div class="srv-page">
    <div class="srv-head">
        <a href="register.html" class="srv-back">← Назад</a>
        <h1 class="srv-title">Выберите сервер</h1>
        <div class="srv-seg" id="srvSeg">
            <button type="button" id="myServerBtn" class="on">Мой сервер</button>
            <button type="button" id="allServersBtn">Все сервера</button>
        </div>
    </div>

    <!-- Мой (последний выбранный) сервер -->
    <section id="singleServerView">
        <div class="srv-mywrap">
            <div class="srv-mylabel">Последний выбранный сервер:</div>
            <div id="srvMyCard"></div>
            <button type="button" class="srv-change" id="changeServerBtn">Сменить сервер</button>
        </div>
    </section>

    <!-- Все сервера -->
    <section id="allServersView" class="hidden">
        <div id="srvSentinel" class="srv-sentinel"></div>
        <div class="srv-tools">
            <div class="srv-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input id="serverSearchInput" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
                       autocapitalize="off" spellcheck="false" placeholder="Поиск сервера…">
                <button type="button" class="srv-clear" id="clearSearchBtn" aria-label="Очистить поиск">×</button>
            </div>
            <div class="srv-chips" id="srvChips"></div>
        </div>
        <div class="srv-count" id="searchResultsCount"></div>
        <div id="srvMine" class="hidden"></div>
        <div id="serversGrid"></div>
    </section>
</div>

<script type="module" src="js/error-logger.js"></script>
<script type="module" src="js/servers.js"></script>
</body>
</html>
